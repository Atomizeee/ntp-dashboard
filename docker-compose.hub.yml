# Runs the published image, no build needed.
#   docker compose -f docker-compose.hub.yml up -d
# Replace the image name with your own, e.g. ghcr.io/<you>/ntp-dashboard:latest
services:
  ntp-dashboard:
    image: ghcr.io/atomizeee/ntp-dashboard:latest
    container_name: ntp-dashboard
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ntp-dashboard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ntp-dashboard-data:
