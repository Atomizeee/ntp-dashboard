# Use this when the dashboard runs on a different machine / LXC / VM than chrony.
# If it runs on the same machine as chrony, use docker-compose.host.yml instead.
services:
  ntp-dashboard:
    build: .
    image: ntp-dashboard:local
    container_name: ntp-dashboard
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      - "${HOST_PORT:-8080}:8080"
    volumes:
      - ntp-dashboard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  ntp-dashboard-data:
